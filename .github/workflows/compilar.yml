name: Compilar y publicar

on:
  push:
    branches: [main, master, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    outputs:
      firmado: ${{ steps.firma.outputs.firmado }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        run: flutter test

      - name: Preparar firma
        id: firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Todas las versiones deben llevar la misma firma para instalarse encima.
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
            echo "firmado=true" >> "$GITHUB_OUTPUT"
            echo "Firma fija (secreto ANDROID_KEYSTORE)."
          elif [ -f android/app/firma/mi-iptv.jks ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "ANDROID_KEYSTORE_PATH=$PWD/android/app/firma/mi-iptv.jks" >> "$GITHUB_ENV"
            echo "firmado=true" >> "$GITHUB_OUTPUT"
            echo "Firma fija (android/app/firma, protegida con el secreto ANDROID_KEYSTORE_PASSWORD)."
          else
            echo "firmado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin firma fija: se compila para probar, pero no se publicará ninguna versión."
          fi

      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }} --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Preparar archivo
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/mi-iptv-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/mi-iptv-android.apk
          retention-days: 7

  windows:
    name: Windows (.exe y .zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar Windows
        run: flutter build windows --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }} --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Crear ZIP portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\mi-iptv-windows-portable.zip

      - name: Crear instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ env.APP_VERSION }}" installer\mi-iptv.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/mi-iptv-windows-portable.zip
            dist/mi-iptv-windows-instalador.exe
            dist/mi-iptv-samsung-tv.wgt
          retention-days: 7

  samsung-tv:
    name: Samsung TV (.wgt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Pruebas
        run: node --test tizen/test/parsers.test.js tizen/test/sync.test.js

      - name: Empaquetar para Samsung TV
        run: |
          mkdir -p dist
          sed -i 's/version="1.0.0"/version="${{ env.APP_VERSION }}"/' tizen/config.xml
          sed -i "s/var VERSION = '1.0.0'/var VERSION = '${{ env.APP_VERSION }}'/" tizen/js/app.js
          # Permiso de Google para sincronizar (secretos del repositorio, nunca en el código).
          sed -i "s|__GOOGLE_CLIENT_ID__|${{ secrets.GOOGLE_CLIENT_ID }}|; s|__GOOGLE_CLIENT_SECRET__|${{ secrets.GOOGLE_CLIENT_SECRET }}|" tizen/js/sync.js
          cd tizen
          zip -r -X ../dist/mi-iptv-samsung-tv.wgt config.xml index.html icon.png css js

      - uses: actions/upload-artifact@v4
        with:
          name: samsung-tv
          path: dist/mi-iptv-samsung-tv.wgt
          retention-days: 7

  publicar:
    name: Publicar en Releases
    needs: [android, windows, samsung-tv]
    # "[sin publicar]" en el commit: compila y prueba, pero no crea versión nueva.
    # Tampoco se publica un APK sin la firma fija (no se podría instalar encima).
    if: ${{ !contains(github.event.head_commit.message, '[sin publicar]') && needs.android.outputs.firmado == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Mi IPTV ${{ env.APP_VERSION }}
          make_latest: true
          body: |
            Versión ${{ env.APP_VERSION }} compilada automáticamente.

            **Windows**
            - `mi-iptv-windows-instalador.exe`: instalador (recomendado).
            - `mi-iptv-windows-portable.zip`: versión sin instalación (descomprimir y abrir `mi_iptv.exe`).

            **Android**
            - `mi-iptv-android.apk`: abrir en el móvil para instalar.

            **Samsung TV**
            - `mi-iptv-samsung-tv.wgt`: aplicación para televisores Samsung (Tizen). Se instala desde el PC con la tele en modo desarrollador (ver el README).
          files: |
            dist/mi-iptv-android.apk
            dist/mi-iptv-windows-portable.zip
            dist/mi-iptv-windows-instalador.exe
            dist/mi-iptv-samsung-tv.wgt
