name: mi_iptv
description: "Reproductor IPTV personal para Windows y Android."
publish_to: 'none'

# El número de versión real lo pone la compilación automática (compilar.yml).
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  window_manager: ^0.5.1
  http: ^1.6.0
  path_provider: ^2.1.6
  file_picker: ^13.3.2
  xml: ^7.1.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
